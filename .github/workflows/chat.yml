name: AI Chat Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - name: Send reply
        uses: actions/github-script@v7
        with:
          script: |
            const comment = "سلام! من مشاور رنگ مو هستم. سوال خود را بپرسید.";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
